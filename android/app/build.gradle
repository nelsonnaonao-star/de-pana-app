apply plugin: 'com.android.application'

// Se marca en el bloque signingConfigs si hay credenciales válidas. Si no las
// hay, el release falla explícitamente antes de compilar (ver taskGraph).
// El error se guarda para diferirlo a tareas release: debug debe poder
// configurarse aunque key.properties esté incompleto.
def releaseSigningConfigured = false
def releaseSigningError = null

android {
    namespace = "com.redon.app"
    compileSdk = rootProject.ext.compileSdkVersion
    buildFeatures {
        buildConfig true
    }
    defaultConfig {
        applicationId "com.redon.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            // Credenciales SOLO desde entorno/CI (MYAPP_UPLOAD_*) o desde
            // android/key.properties (ignorado por Git). Nunca hardcodeadas.
            // Los errores se guardan y se lanzan únicamente en tareas release.
            def uploadProps = [
                'MYAPP_UPLOAD_STORE_FILE',
                'MYAPP_UPLOAD_STORE_PASSWORD',
                'MYAPP_UPLOAD_KEY_ALIAS',
                'MYAPP_UPLOAD_KEY_PASSWORD',
            ]
            // Acepta -P / ORG_GRADLE_PROJECT_* y variables de entorno con
            // el mismo nombre. Nunca valores por defecto hardcodeados.
            def uploadValues = uploadProps.collectEntries { key ->
                [(key): (project.findProperty(key) ?: System.getenv(key))]
            }
            if (uploadValues.values().any { it }) {
                def missingProps = uploadProps.findAll { !uploadValues[it] }
                if (missingProps) {
                    releaseSigningError =
                        "Firma de release incompleta: faltan ${missingProps.join(', ')}."
                } else {
                    def store = file(uploadValues['MYAPP_UPLOAD_STORE_FILE'])
                    if (!store.exists()) {
                        releaseSigningError =
                            'El keystore indicado por MYAPP_UPLOAD_STORE_FILE no existe.'
                    } else {
                        storeFile store
                        storePassword uploadValues['MYAPP_UPLOAD_STORE_PASSWORD']
                        keyAlias uploadValues['MYAPP_UPLOAD_KEY_ALIAS']
                        keyPassword uploadValues['MYAPP_UPLOAD_KEY_PASSWORD']
                        releaseSigningConfigured = true
                    }
                }
            } else {
                // WEPA_KEY_PROPERTIES permite a CI (y a las pruebas) usar otra ruta.
                def keyPropertiesFile = rootProject.file(
                    project.findProperty('WEPA_KEY_PROPERTIES') ?: 'key.properties'
                )
                if (keyPropertiesFile.exists()) {
                    def keyProperties = new Properties()
                    keyPropertiesFile.withInputStream { keyProperties.load(it) }
                    def requiredKeys = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
                    def missingKeys = requiredKeys.findAll { !keyProperties[it] }
                    if (missingKeys) {
                        releaseSigningError =
                            "Firma de release incompleta en ${keyPropertiesFile.name}: faltan ${missingKeys.join(', ')}."
                    } else {
                        def store = file(keyProperties['storeFile'])
                        if (!store.exists()) {
                            releaseSigningError =
                                "El keystore configurado en ${keyPropertiesFile.name} no existe."
                        } else {
                            storeFile store
                            storePassword keyProperties['storePassword']
                            keyAlias keyProperties['keyAlias']
                            keyPassword keyProperties['keyPassword']
                            releaseSigningConfigured = true
                        }
                    }
                }
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

// Fallo explícito y seguro SOLO cuando se pide un artefacto de release.
// Así `assembleDebug` sigue funcionando sin credenciales, pero un release sin
// key.properties/propiedades MYAPP_UPLOAD_* no puede compilarse por accidente.
gradle.taskGraph.whenReady { graph ->
    def buildsRelease = graph.allTasks.any { t ->
        t.project == project && (
            t.name == 'assembleRelease' ||
            t.name == 'bundleRelease' ||
            t.name == 'installRelease' ||
            t.name.startsWith('packageRelease') ||
            t.name.startsWith('signRelease') ||
            t.name == 'validateSigningRelease'
        )
    }
    if (buildsRelease && !releaseSigningConfigured) {
        throw new GradleException(
            releaseSigningError ?:
            'Firma de release no configurada: crea android/key.properties con ' +
            'storeFile, storePassword, keyAlias y keyPassword, o define las ' +
            'propiedades MYAPP_UPLOAD_* en el entorno de CI. ' +
            'No se permiten credenciales hardcodeadas.'
        )
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    implementation "com.google.firebase:firebase-messaging:25.0.1"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
